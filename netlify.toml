[functions]
  directory = "netlify/functions"

# Webinar-Zahlungslinks ab 07.10.2026 00:00 Uhr (Berlin) deaktivieren = 06.10. 22:00 UTC
[functions."deactivate-webinar-links"]
  schedule = "0 22 6 10 *"

[[redirects]]
  from = "/kuendigen"
  to = "/kuendigen.html"
  status = 200

[[redirects]]
  from = "/agb"
  to = "/agb.html"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer.html"
  status = 200

